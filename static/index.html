<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>piphone</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="/js/common.js"></script>
<style id="baseStyle"></style>
<style>
.home-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.time-block{display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:28px 0 20px;flex-shrink:0}
.big-time{font-size:52px;font-weight:300;color:var(--txt);letter-spacing:-1px;line-height:1}
.big-date{font-size:13px;color:var(--muted);margin-top:6px}
.apps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:16px 20px;flex-shrink:0}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
.app-icon:active .icon-wrap{transform:scale(0.93)}
.icon-wrap{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;font-size:26px;color:#fff;transition:transform 0.1s;position:relative}
.app-label{font-size:11px;color:var(--muted);text-align:center}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;
  background:var(--red);color:#fff;font-size:9px;font-weight:500;
  display:none;align-items:center;justify-content:center;padding:0 4px}
.badge.show{display:flex}
.status-strip{margin:0 16px;padding:10px 14px;background:var(--panel);border-radius:12px;
  border:0.5px solid var(--border-c);display:flex;align-items:center;justify-content:space-between}
.strip-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.strip-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
</style>
</head>
<body>
<div class="screen">
  <div class="sbar">
    <span id="sbCarrier">--- · ---</span>
    <div class="sig">
      <span class="sig-bar" style="height:4px"></span>
      <span class="sig-bar" style="height:6px"></span>
      <span class="sig-bar" style="height:8px"></span>
      <span class="sig-bar" style="height:10px"></span>
      <span class="sig-bar" style="height:12px"></span>
    </div>
    <span id="sbClock">--:--</span>
  </div>
  <div class="home-body">
    <div class="time-block">
      <div class="big-time" id="bigTime">--:--</div>
      <div class="big-date" id="bigDate">---</div>
    </div>
    <div class="status-strip">
      <div class="strip-item"><div class="strip-dot"></div><span id="simStatus">Registered</span></div>
      <div class="strip-item"><i class="ti ti-wifi" style="font-size:14px"></i><span id="ratStatus">---</span></div>
      <div class="strip-item"><i class="ti ti-cpu" style="font-size:14px"></i><span>Pi 5</span></div>
    </div>
    <div class="apps-grid">
      <div class="app-icon" onclick="go('phone.html')">
        <div class="icon-wrap" style="background:#16a34a">
          <i class="ti ti-phone"></i>
          <div class="badge" id="badgeCall"></div>
        </div>
        <span class="app-label">Phone</span>
      </div>
      <div class="app-icon" onclick="go('sms.html')">
        <div class="icon-wrap" style="background:#1d4ed8">
          <i class="ti ti-message-2"></i>
          <div class="badge" id="badgeSms"></div>
        </div>
        <span class="app-label">Messages</span>
      </div>
      <div class="app-icon" onclick="go('contacts.html')">
        <div class="icon-wrap" style="background:#7c3aed">
          <i class="ti ti-address-book"></i>
        </div>
        <span class="app-label">Contacts</span>
      </div>
      <div class="app-icon" onclick="toast('Settings coming soon')">
        <div class="icon-wrap" style="background:#475569">
          <i class="ti ti-settings"></i>
        </div>
        <span class="app-label">Settings</span>
      </div>
      <div class="app-icon" onclick="toast('Data coming soon')">
        <div class="icon-wrap" style="background:#0891b2">
          <i class="ti ti-wifi"></i>
        </div>
        <span class="app-label">Data</span>
      </div>
      <div class="app-icon" onclick="toast('USSD coming soon')">
        <div class="icon-wrap" style="background:#b45309">
          <i class="ti ti-hash"></i>
        </div>
        <span class="app-label">USSD</span>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
document.getElementById("baseStyle").textContent = BASE_CSS;
function go(page){window.location.href=page}
function bigTick(){
  const n=new Date();
  document.getElementById("bigTime").textContent=
    String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
  document.getElementById("bigDate").textContent=
    n.toLocaleDateString("en-IL",{weekday:"long",month:"long",day:"numeric"});
}
bigTick();setInterval(bigTick,10000);
StatusBar.init();
async function checkUnread(){
  try{
    const ts=await(await fetch("/api/sms/inbox")).json();
    const total=ts.reduce((s,t)=>s+(t.unread||0),0);
    const b=document.getElementById("badgeSms");
    b.textContent=total>9?"9+":total;
    b.classList.toggle("show",total>0);
  }catch(e){}
}
checkUnread();setInterval(checkUnread,15000);
SSE.on("sms",d=>{checkUnread();toast("SMS: "+(d.name||d.from),3000)});
SSE.on("ring",d=>{toast("Incoming: "+(d.from||"unknown"),5000)});
SSE.connect();
</script>
</body>
</html>
